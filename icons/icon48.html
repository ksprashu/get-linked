<!DOCTYPE html>
<html>
<head>
  <title>Icon 48x48</title>
  <style>
    body { margin: 0; padding: 0; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="icon" width="48" height="48"></canvas>
  <script>
    const canvas = document.getElementById('icon');
    const ctx = canvas.getContext('2d');

    // Background
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, 48, 48);

    // Border
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 3;
    ctx.strokeRect(3, 3, 42, 42);

    // Text
    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('AI', 24, 18);
    ctx.fillText('RE', 24, 30);

    // Instructions
    console.log('Right-click on the canvas and select "Save Image As..." to save as icon48.png');
  </script>
</body>
</html>
